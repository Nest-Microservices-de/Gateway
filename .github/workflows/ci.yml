name: Client Gateway CI

on: 
    push: 
        branches:
            -main 
    pull_request:
        branches:
            -main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repositoey
              uses: actions/checkout@v4

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                   node-version: 22
            
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                 version: 10
            
            - name: Install dependencies
              run: pnpm install

            - name: Build project
              run: pnpm build

            - name: Run unit tests
              run: pnpm test





    
