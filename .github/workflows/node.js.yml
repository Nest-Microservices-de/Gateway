# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repositoey
      uses: actions/checkout@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
            
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
            
    - name: Install dependencies
      run: pnpm install

    - name: Build project
      run: pnpm build

    - name: Run unit tests
      env:
        PORT: 3000
        PRODUCTS_SERVICE_HOST: 'localhost'
        PRODUCTS_SERVICE_PORT: 3001
        ORDERS_SERVICE_HOST: 'localhost'
        ORDERS_SERVICE_PORT: 3002
        DETAILS_SERVICE_HOST: 'localhost'
        DETAILS_SERVICE_PORT: 3003
        DATABASE_URL: 'saasasas'
      run: pnpm test

